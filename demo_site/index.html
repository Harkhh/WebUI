<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>演示商城 - 登录</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f0f2f5;
         display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); width: 320px; }
  h1 { font-size: 20px; text-align: center; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border: 1px solid #d9d9d9; border-radius: 6px; }
  button { width: 100%; padding: 10px; margin-top: 12px; background: #1677ff; color: #fff;
           border: 0; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .error { color: #cf1322; background: #fff1f0; border: 1px solid #ffa39e;
           padding: 8px; border-radius: 6px; margin-top: 10px; display: none; font-size: 13px; }
  .tips { font-size: 12px; color: #888; margin-top: 16px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="card">
    <h1 class="brand">演示商城</h1>
    <input id="username" placeholder="用户名">
    <input id="password" type="password" placeholder="密码">
    <button id="login-btn">登 录</button>
    <div id="error" class="error"></div>
    <div class="tips">
      测试账号：<br>
      standard / 123456 （正常用户）<br>
      locked / 123456 （锁定用户）<br>
      其他密码将返回"用户名或密码错误"
    </div>
  </div>
<script>
  const USERS = {
    standard: { password: "123456", locked: false },
    locked:   { password: "123456", locked: true }
  };
  document.getElementById("login-btn").addEventListener("click", () => {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value;
    const err = document.getElementById("error");
    err.style.display = "block";
    const user = USERS[u];
    if (!user) { err.textContent = "用户名或密码错误"; return; }
    if (user.password !== p) { err.textContent = "用户名或密码错误"; return; }
    if (user.locked) { err.textContent = "账号已被锁定，请联系管理员"; return; }
    localStorage.setItem("username", u);
    location.href = "products.html";
  });
</script>
</body>
</html>
